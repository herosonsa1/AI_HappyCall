; ============================================================================
; [IP-PBX 다이얼플랜 설정] Asterisk 20 LTS - extensions_happycall.conf
; AI 아웃바운드 해피콜 발신, MixMonitor 실시간 전수 녹취, AudioSocket 브릿지
; ============================================================================

[happycall-outbound]
exten => _X.,1,NoOp(=== [AI HappyCall Outbound] CallID: ${HAPPYCALL_UUID} / CustID: ${CUST_ID} ===)
 same => n,Set(CHANNEL(language)=ko)
 same => n,Set(CDR(happycall_uuid)=${HAPPYCALL_UUID})
 same => n,Set(CDR(cust_id)=${CUST_ID})
 same => n,Set(CDR(campaign_id)=${CAMPAIGN_ID})
 same => n,Set(REC_FILE=/var/spool/asterisk/monitor/happycall/${STRFTIME(${EPOCH},,%Y%m%d)}/${HAPPYCALL_UUID}_raw.wav)
 same => n,MixMonitor(${REC_FILE},b)
 same => n,Answer()
 same => n,Wait(0.2)
 ; AudioSocket 양방향 8kHz/16kHz PCM 스트리밍 연결 (app-02-voice-stream-gateway:9092)
 same => n,AudioSocket(${HAPPYCALL_UUID},127.0.0.1:9092)
 same => n,StopMixMonitor()
 same => n,Hangup()

[happycall-agent-transfer]
exten => 9999,1,NoOp(=== [AI HappyCall Escalation] Transferring ${HAPPYCALL_UUID} to Human Agent Queue ===)
 same => n,Set(CALLERID(name)=AI_ESC_${CUST_ID})
 same => n,Queue(happycall-cs-queue,tT,,,60)
 same => n,Hangup()
