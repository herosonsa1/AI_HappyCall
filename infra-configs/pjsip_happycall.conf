; ============================================================================
; [IP-PBX 연동 설정] Asterisk 20 LTS - pjsip_happycall.conf
; 폐쇄망 통신사 SIP Trunk 연동 및 RFC 2833 (dtmfmode=rfc4733) 키패드 감지 설정
; ============================================================================

[transport-udp-happycall]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=10.10.0.0/16
local_net=192.168.0.0/16

[carrier-sip-trunk]
type=endpoint
transport=transport-udp-happycall
context=from-happycall-trunk
disallow=all
allow=ulaw
allow=alaw
dtmf_mode=rfc4733
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
timers=yes
timers_min_se=90
timers_sess_expires=1800
aors=carrier-sip-trunk-aor
from_domain=sip.internal-carrier.local

[carrier-sip-trunk-aor]
type=aor
contact=sip:10.10.10.50:5060
qualify_frequency=30
qualify_timeout=3.0

[carrier-sip-trunk-identify]
type=identify
endpoint=carrier-sip-trunk
match=10.10.10.50
