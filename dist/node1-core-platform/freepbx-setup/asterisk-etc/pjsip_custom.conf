; ============================================================================
; [/etc/asterisk/pjsip_custom.conf]
; 히어로손해사정 AI 자동 해피콜 — FreePBX 17 (Asterisk 20 PJSIP) 트렁크 및 로컬 테스트 내선 설정
; 1) [hero-sip-trunk] : 사내 IP-PBX (또는 통신사 KT/LGU+/SKB SIP Trunk) 연동 설정
; 2) [1001]           : 로컬 개발/검증용 소프트폰(MicroSIP, Zoiper, Linphone) 테스트 내선
; ============================================================================

; --- [1] 사내 IP-PBX / 통신사 SIP Trunk 설정 (운영 환경) ---
[hero-sip-trunk]
type=endpoint
transport=transport-udp
context=from-pstn
disallow=all
allow=ulaw
allow=alaw
allow=slin16
dtmf_mode=rfc4733
aors=hero-sip-trunk-aor
from_domain=10.20.10.10
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
language=ko

[hero-sip-trunk-aor]
type=aor
contact=sip:10.20.10.10:5060
qualify_frequency=30

[hero-sip-trunk-identify]
type=identify
endpoint=hero-sip-trunk
match=10.20.10.10

; --- [2] 로컬 테스트용 소프트폰 내선 (1001번 / 비밀번호: hero1001!) ---
[1001]
type=endpoint
transport=transport-udp
context=from-internal-custom
disallow=all
allow=ulaw
allow=alaw
allow=slin16
dtmf_mode=rfc4733
auth=1001-auth
aors=1001-aor
direct_media=no
rtp_symmetric=yes
force_rport=yes
callerid="Hero Test Customer" <01082345678>

[1001-auth]
type=auth
auth_type=userpass
username=1001
password=hero1001!

[1001-aor]
type=aor
max_contacts=5
remove_existing=yes
qualify_frequency=30
