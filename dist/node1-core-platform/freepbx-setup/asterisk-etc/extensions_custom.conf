; ============================================================================
; [/etc/asterisk/extensions_custom.conf]
; 히어로손해사정 AI 자동 해피콜 — Asterisk 20 Dialplan (AudioSocket 양방향 16kHz PCM 연동)
; - Node 1 통합 코어 서버의 ARI Originate (POST /ari/channels) 호출 시
;   [ai-happycall-bot] 컨텍스트의 s(또는 9000) 확장으로 진입하여 AudioSocket TCP 연결 수립
; - 로컬 소프트폰(내선 1001)에서 9999번으로 발신 시 즉시 AI 해피콜 봇 테스트 가능
; ============================================================================

[globals]
; 운영 환경(동일 물리 서버 #1 내 기동 시): 127.0.0.1:9092
; 로컬 Windows Docker 환경 기동 시        : host.docker.internal:19092
NODE1_AUDIOSOCKET_ADDR=127.0.0.1:9092
NODE1_AUDIOSOCKET_LOCAL=127.0.0.1:19092

[ai-happycall-bot]
; 1) Node 1 ARI Originate (POST /ari/channels)가 고객 전화를 연결한 직후 진입하는 다이얼플랜
exten => s,1,NoOp(=== [HERO AI HAPPYCALL] Outbound Call Connected: Claim=${CLAIM_NO}, Insurer=${INSURER} ===)
 same => n,Answer()
 same => n,Set(JITTERBUFFER(adaptive)=default)
 same => n,Set(CHANNEL(language)=ko)
 same => n,Set(CALL_UUID=${IF($["${SESSION_UUID}" != ""]?${SESSION_UUID}:${SHELL(cat /proc/sys/kernel/random/uuid | tr -d '\n')})})
 same => n,Set(TARGET_AS=${IF($["${AUDIOSOCKET_HOST}" != ""]?${AUDIOSOCKET_HOST}:${NODE1_AUDIOSOCKET_ADDR})})
 same => n,NoOp(=== Connecting Full-Duplex 16kHz AudioSocket UUID=${CALL_UUID} to Node1=${TARGET_AS} ===)
 same => n,AudioSocket(${CALL_UUID},${TARGET_AS})
 same => n,Hangup()

exten => 9000,1,Goto(ai-happycall-bot,s,1)

[from-internal-custom]
; 2) 로컬 소프트폰(MicroSIP 등, 내선 1001)에서 9999번을 누르면 즉시 로컬 Node 1(19092) AI 음성봇과 통화 테스트
exten => 9999,1,NoOp(=== [LOCAL SOFTPHONE TEST] Connecting to Node 1 AudioSocket ===)
 same => n,Answer()
 same => n,Set(CLAIM_NO=HC-2026-884920)
 same => n,Set(INSURER=한화손해보험)
 same => n,Set(SESSION_UUID=00000000-0000-4000-8000-000000884920)
 same => n,AudioSocket(${SESSION_UUID},${NODE1_AUDIOSOCKET_LOCAL})
 same => n,Hangup()
